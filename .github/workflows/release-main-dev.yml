name: Identity Main Release (Dev)

# 모놀리스의 Main Release 흐름을 Identity 서비스에 맞게 적용한다.
# main 커밋은 검증(build.yml)을 먼저 통과해야만 ECR publish가 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: identity-main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Identity Release
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish Identity Image
    needs: verify
    uses: ./.github/workflows/publish-ecr.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write

  # ECR에 올라간 immutable digest만 GitOps에 전달한다. 공용 workflow는
  # GitHub App 토큰으로 travel-gitops PR을 만들며, 여기서 직접 배포하지 않는다.
  update-gitops:
    name: Create Identity GitOps PR
    needs: publish
    uses: KDT-TravelPlanner/travel-gitops/.github/workflows/update-gitops.yml@develop
    secrets:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
    with:
      service-name: identity
      image-ref: ${{ needs.publish.outputs.image_ref }}
      deployment-patch-path: k8s/overlays/dev-eks/workload/identity/deployment.patch.yaml

  release-summary:
    name: Release Summary
    needs: [verify, publish, update-gitops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write release summary
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          GITOPS_RESULT: ${{ needs.update-gitops.result }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          {
            echo "### Identity release result"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Verification | ${VERIFY_RESULT} |"
            echo "| ECR image publish | ${PUBLISH_RESULT} |"
            echo "| GitOps image update PR | ${GITOPS_RESULT} |"
            if [[ "${PUBLISH_RESULT}" == "success" ]]; then
              echo
              echo "Published image: \`${IMAGE_REF}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
